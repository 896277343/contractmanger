{% extends "contracts/base.html" %}{% block content %}<h1>导入 OA 信息</h1><div class="card"><h2>按流水号在线读取</h2><p>在能访问 OA 内网的环境中，可用自己的 OA 账号和流水号直接读取。</p><a class="button" href="{% url 'import_oa_online' %}">输入 OA 流水号</a></div><div class="card"><h2>上传 OA 导出文件</h2><p>可直接选择 OA 导出的 ZIP，也可选择 HTML。系统读取合同编号、流程开始日期、合同信息产品和供货物料；ZIP 中的附件文件夹不会导入。</p><form method="post" enctype="multipart/form-data">{% csrf_token %}<input type="file" name="file" accept=".html,.htm,.zip" required> <button>导入合同</button></form><p class="muted">合同信息按序号补充 Line items，OA 未提供的字段保留。请在合同管理中核对签订日期、国家、金额等字段。</p></div>{% endblock %}
